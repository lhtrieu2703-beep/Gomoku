rules.l1=15×15 board. Players take turns placing a stone on an empty cell; Black goes first.
rules.l2=You win with 5 or more stones of your colour in a row (horizontal, vertical or diagonal). Rows of 6 or more also win.
rules.l3=If the opponent blocks BOTH ends of the row, it does NOT count as a win. One blocked end, or one end at the board edge, still wins.
rules.l4=If the board is full and nobody has won, the game is a draw.
rules.l5=There are no forbidden moves (3-3, 4-4) and no time limit per move.
rules.l6=Undo: in 2-player mode it takes back 1 move; against the computer it also takes back the computer's move. Undo is not available in LAN mode.
rules.winExample=Win
rules.noWinExample=No win (both ends blocked)
