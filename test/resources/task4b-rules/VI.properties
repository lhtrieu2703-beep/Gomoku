rules.l1=Bàn cờ 15×15. Hai người luân phiên đặt quân vào ô trống; Quân Đen đi trước.
rules.l2=Thắng khi có từ 5 quân cùng màu liên tiếp theo hàng ngang, hàng dọc hoặc đường chéo. Dãy 6 quân trở lên cũng thắng.
rules.l3=Nếu dãy bị quân đối thủ chặn sát cả hai đầu thì KHÔNG tính thắng. Chặn một đầu, hoặc một đầu sát mép bàn, vẫn thắng.
rules.l4=Bàn đầy mà chưa ai thắng thì hòa.
rules.l5=Không có luật cấm tay (3-3, 4-4) và không giới hạn thời gian mỗi nước.
rules.l6=Đi lại: chế độ 2 người rút 1 nước; khi chơi với máy sẽ rút cả nước của máy. Chế độ LAN không có đi lại.
rules.winExample=Thắng
rules.noWinExample=Không thắng (bị chặn hai đầu)
