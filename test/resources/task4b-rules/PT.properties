rules.l1=Tabuleiro 15×15. Os jogadores alternam colocando uma peça numa casa vazia; as Pretas começam.
rules.l2=Vence quem formar 5 ou mais peças da sua cor em linha (horizontal, vertical ou diagonal). Linhas de 6 ou mais também vencem.
rules.l3=Se o adversário bloquear AMBAS as extremidades da linha, NÃO conta como vitória. Com uma extremidade bloqueada, ou uma extremidade na borda do tabuleiro, ainda vence.
rules.l4=Se o tabuleiro ficar cheio sem vencedor, o jogo termina empatado.
rules.l5=Não há jogadas proibidas (3-3, 4-4) nem limite de tempo por jogada.
rules.l6=Desfazer: no modo de 2 jogadores desfaz 1 jogada; contra o computador desfaz também a jogada do computador. Não está disponível no modo LAN.
rules.winExample=Vitória
rules.noWinExample=Sem vitória (as duas extremidades bloqueadas)
